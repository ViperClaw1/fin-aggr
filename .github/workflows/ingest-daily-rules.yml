# eCFR 12 CFR 330, 745, 328 and the Federal Register. 05:47 UTC (plan step 5).
# eCFR jobs run one after another (needs), so ecfr.gov sees one request at a time.
# !cancelled(): a failed or refused part does not skip the next one.
name: Ingest daily rules

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecfr-330:
    uses: ./.github/workflows/ingest-source.yml
    with:
      source: ecfr-330
      timeout-minutes: 15
    secrets: inherit

  ecfr-745:
    needs: ecfr-330
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ingest-source.yml
    with:
      source: ecfr-745
      timeout-minutes: 15
    secrets: inherit

  ecfr-328:
    needs: ecfr-745
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ingest-source.yml
    with:
      source: ecfr-328
      timeout-minutes: 15
    secrets: inherit

  federal-register:
    uses: ./.github/workflows/ingest-source.yml
    with:
      source: federal-register
      timeout-minutes: 15
    secrets: inherit
