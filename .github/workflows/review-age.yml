# Comments on private review issues that have been open for more than 3 days (ADR-020).
# Also exits 1 when a scheduled ingest source has no job_runs row in its silence window.
# Stdout is counters, "overdue #N mentioned", and "silent <id>". Diffs and snapshot URLs stay out.
name: Review age

on:
  schedule:
    # 08:17 UTC+4
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  overdue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check secrets
        run: |
          missing=""
          for n in SUPABASE_DB_URL REVIEW_REPO_TOKEN; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::Actions secrets not set:$missing"; exit 1; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REVIEW_REPO_TOKEN: ${{ secrets.REVIEW_REPO_TOKEN }}
      - run: pnpm ingest:overdue
        env:
          REVIEW_REPO_TOKEN: ${{ secrets.REVIEW_REPO_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
