# DataGateway contract against supabase start (ADR-019 step 3), and nightly against prod.
# Pull requests run it only with the `db` label. Nightly and manual runs do not need the label.
name: DB contract

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  contract:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'db')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # CLI is the pinned `supabase` devDependency (ADR-014). setup-cli@v1
      # downloads the binary from GitHub Releases and dies on HTTP 504.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor
      - run: pnpm db:seed --target local
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - id: keys
        run: |
          pnpm exec supabase status -o env > status.env
          key=$(sed -n 's/^ANON_KEY=//p' status.env | tr -d '"')
          echo "anon=$key" >> "$GITHUB_OUTPUT"
      - name: Contract tests
        run: pnpm vitest run apps/web/src/shared/api/gateway.supabase.test.ts
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ steps.keys.outputs.anon }}

  # Same suite against the hosted prod project (there is no staging, ADR-019). Read-only: the
  # anon key under RLS cannot write. Not on pull requests: a PR must not depend on live data.
  contract-prod:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract tests (prod, read-only)
        run: |
          for n in SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!n}" ]; then echo "::error::Actions secret $n is not set"; exit 1; fi
          done
          pnpm vitest run apps/web/src/shared/api/gateway.supabase.test.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
