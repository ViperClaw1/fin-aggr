# One scheduled source (ADR-020). Callers own the cron. This job owns the lock and the timeout.
# Stdout is the runner's fixed line. No artifacts.
name: Ingest source

on:
  workflow_call:
    inputs:
      source:
        description: Schedule id from packages/ingest/src/schedule.ts
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes
        required: true
        type: number

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: ingest-${{ inputs.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Ids passed to registerJob. A source that is not ready skips this and stays green.
      - name: Check secrets
        if: contains(fromJSON('["fdic-institutions","treasury-par-yield","fdic-financials","ncua-5300","fdic-national-rates","treasury-fiscal-data","treasurydirect","ecfr-330","ecfr-745","ecfr-328","federal-register"]'), inputs.source)
        run: |
          missing=""
          for n in SUPABASE_DB_URL REVIEW_REPO_TOKEN; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then echo "::error::Actions secrets not set:$missing"; exit 1; fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          REVIEW_REPO_TOKEN: ${{ secrets.REVIEW_REPO_TOKEN }}
      - name: Check FRED key
        if: inputs.source == 'fdic-national-rates'
        run: |
          if [ -z "$FRED_API_KEY" ]; then echo "::error::Actions secret FRED_API_KEY is not set"; exit 1; fi
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: pnpm ingest:run ${{ inputs.source }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REVIEW_REPO_TOKEN: ${{ secrets.REVIEW_REPO_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FA_SCRAPE_MAILBOX: ${{ secrets.FA_SCRAPE_MAILBOX }}
