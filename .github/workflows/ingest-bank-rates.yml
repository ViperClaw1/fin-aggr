# Bank rates, one bank at a time. :17 and :47, hours 03–10 UTC, timeout 120 minutes (ADR-020).
# Minute 0 is when GitHub drops and delays the most schedules.
# A bank already requested in this overnight window is skipped inside the job.
# amex-cd-page runs at the end of the same job, once per UTC week, inside the Denver window.
# Manual workflow_dispatch does not skip the overnight window (ADR-020).
# A manual run is inside that window only while the bank's local hour is 22–05.
# Standard time, from 22:00 local until 06:00 local:
# Eastern 03:00–11:00, Central 04:00–12:00, Mountain 05:00–13:00,
# Pacific 06:00–14:00, Alaska 07:00–15:00, Hawaii 08:00–16:00 UTC.
# Daylight time is one hour earlier, except Hawaii and Arizona (America/Phoenix stays 05:00–13:00).
name: Ingest bank rates

on:
  schedule:
    - cron: '17 3-10 * * *'
    - cron: '47 3-10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bank-rates:
    uses: ./.github/workflows/ingest-source.yml
    with:
      source: bank-rates
      timeout-minutes: 120
    secrets: inherit
