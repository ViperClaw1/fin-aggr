# Nightly shape check (plan steps 6 and 7): one FDIC institutions row,
# eCFR title 12 part 330, one Federal Register document, and the Treasury par-yield header.
# An eCFR amendment change prints "ecfr 330 changed" and still exits 0.
# A broken response shape exits 1. No artifacts.
name: Ingest live shape

on:
  schedule:
    # 06:30 UTC, before the 07:00 directory pull
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdic-institutions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ingest-fdic-institutions-shape
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest:live
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
