# All gates from spec §7.5, zero warnings (AC-1, AC-10).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 02:00 UTC+4. Firefox and WebKit only; the other jobs skip a schedule run.
  schedule:
    - cron: '0 22 * * *'

jobs:
  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:canaries
      - run: pnpm rules:check
      - run: pnpm depcruise
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm ingest:run ncua-5300 # not ready → "source ncua-5300 pending", exit 0, no secrets
      - run: pnpm bench # spec §5: rankProducts ≤ 50 ms on 120 products and on the 60 CDs
      - run: pnpm golden:check # Python 3 ships with ubuntu-latest
      - run: pnpm build
      - run: pnpm bundle:report # First Load JS per route; fails above 200 KB on /compare/[category] (ADR-016 D7)
      - run: pnpm --filter @fa/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # Median of 5 mobile runs on pnpm start. Performance and CLS on /compare/cd fail the job.
  # TBT stays a warning (ADR-016). A dot-directory is hidden, so the upload must include it.
  # Firefox and WebKit on the production build (E7 step 3). Not on pull requests.
  # 30 minutes is short: the production build, then WebKit's system packages (~114 MB via
  # `playwright install --with-deps`), then the browser suite itself (~9 minutes).
  e2e-browsers:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fa/web exec playwright install --with-deps firefox webkit
      - run: pnpm e2e:browsers

  lighthouse:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        scenario: [anonymous, profile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lhci
        if: matrix.scenario == 'anonymous'
      - run: pnpm lhci:profile
        if: matrix.scenario == 'profile'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.scenario }}
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: error

  # Vercel deploys main on its own. Fail when the live HTML is still another commit.
  # `<meta name="build">` is VERCEL_GIT_COMMIT_SHA (layout.tsx); locally it is "local".
  production-commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The script polls for 15 minutes. Leave room for checkout and a slow Vercel deploy.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-production-commit.mjs https://fin-aggr.vercel.app ${{ github.sha }}
