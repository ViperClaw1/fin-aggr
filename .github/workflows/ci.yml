# All gates from spec §7.5, zero warnings (AC-1, AC-10).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:canaries
      - run: pnpm rules:check
      - run: pnpm depcruise
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm bench # spec §5: rankProducts ≤ 50 ms on 120 products and on the 60 CDs
      - run: pnpm golden:check # Python 3 ships with ubuntu-latest
      - run: pnpm build
      - run: pnpm bundle:report # First Load JS per route; fails above 200 KB on /compare/[category] (ADR-016 D7)
      - run: pnpm --filter @fa/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  # Report only (E7 step 1). Assertions are warnings; a red score does not fail this job.
  # A failed build or a missing Puppeteer Chrome still does. Median of 5 mobile runs.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        scenario: [anonymous, profile]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lhci
        if: matrix.scenario == 'anonymous'
      - run: pnpm lhci:profile
        if: matrix.scenario == 'profile'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-${{ matrix.scenario }}
          path: .lighthouseci
          if-no-files-found: warn

  # Vercel deploys main on its own. Fail when the live HTML is still another commit.
  # `<meta name="build">` is VERCEL_GIT_COMMIT_SHA (layout.tsx); locally it is "local".
  production-commit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check-production-commit.mjs https://fin-aggr.vercel.app ${{ github.sha }}
