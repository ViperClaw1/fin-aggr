<p class="indent-1" data-title="745.1(e)">
  <span class="paragraph-hierarchy"><span class="paren">(</span>e<span class="paren">)</span></span>
  The term “standard maximum share insurance amount,” referred to as the “SMSIA” hereafter, means
  $250,000 adjusted pursuant to subparagraph (F) of section 11(a)(1) of the Federal Deposit
  Insurance Act (<a
    href="https://www.govinfo.gov/link/uscode/12/1821"
    class="usc external"
    target="_blank"
    rel="noopener noreferrer"
    >12 U.S.C. 1821(a)(1)(F)</a
  >).
</p>
